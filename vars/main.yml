# vars file
---
hp_proliant_support_pack_keyring_dst: /usr/share/keyrings/hpePublicKey.gpg
hp_proliant_support_pack_repositories:
  - type: deb
    url: "https://downloads.linux.hpe.com/SDR/repo/mcp/ubuntu {{ ansible_facts['distribution_release'] }}/{{ hp_proliant_support_pack_repository_version }}"
    component: non-free
    state: absent
  - type: deb
    url: "http://downloads.linux.hpe.com/SDR/repo/mcp/ubuntu {{ ansible_facts['distribution_release'] }}/{{ hp_proliant_support_pack_repository_version }}"
    component: non-free
    state: absent
  - type: "deb [signed-by={{ hp_proliant_support_pack_keyring_dst }}]"
    url: "https://downloads.linux.hpe.com/SDR/repo/mcp/ubuntu {{ ansible_facts['distribution_release'] }}/{{ hp_proliant_support_pack_repository_version }}"
    component: non-free

hp_proliant_support_pack_dependencies_pre:
  - software-properties-common
  - dirmngr
  - apt-transport-https
  - wget
